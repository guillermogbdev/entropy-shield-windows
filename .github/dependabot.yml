version: 2
updates:
  # Build dependencies are pinned on purpose (reproducible releases), so they
  # are updated monthly and grouped into a single PR that a human reviews.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  # GitHub deprecates action runtimes regularly (Node 20 -> 24).  A grouped
  # monthly PR keeps the workflow working without a stream of individual PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
