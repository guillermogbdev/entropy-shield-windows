name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-windows.ps1 -SkipInstall

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: entropy-shield-windows-${{ github.sha }}
          path: dist/Entropy Shield
          if-no-files-found: error
